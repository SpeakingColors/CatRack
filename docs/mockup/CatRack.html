<title>CatRack Mockup</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700;1,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout concept: one fixed 1200 x 640 stage scaled as a piece. Wood cheeks left and right.
   Middle: header, then rack column (routing strip, toolbar, unit rows), unit panel, in/out meters. */
:root{
  --bg:#0b0b0d; --plate:#16171a; --plate2:#1e2024; --line:#33363d; --ink:#f4f5f7; --dim:#a9adb8;
  --title:#e8e9ee; --accent:#02EBBA; --disp:#06080a; --grid:#1b2523;
  --g:#02EBBA; --y:#FFD100; --o:#F57F01; --r:#FF1383; --b:#6CC9F5; --p:#A43DFF;
  --sel:#241238; --selb:#CD92FE; --pink:#FF7BB1; --gr:#FF7BB1;
  --font-ui:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-num:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
  color-scheme:dark;
}
:root[data-look="A"]{--bg:#161638;--plate:#1c1c4a;--plate2:#2C2C62;--line:#33403f;--ink:#e8e6e1;--dim:#a8a49e;--title:#E1CBF4;--accent:#FFA600;--disp:#05060d;--y:#FFA600}
:root[data-look="B"]{--bg:#0b0b0d;--plate:#15161a;--plate2:#1c1d22;--line:#2b2d34;--ink:#f4f5f7;--dim:#a9adb8;--title:#E1CBF4;--accent:#A43DFF;--disp:#06080a}
html,body{background:var(--bg);margin:0}
#stage,#stage *{box-sizing:border-box}
body{color:var(--ink);font-family:var(--font-ui);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
#app{background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
#frame{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:1200px;height:640px;transform-origin:0 0;display:flex;background:#000;user-select:none;-webkit-user-select:none}
.cheek{width:52px;flex:none;position:relative;cursor:default}
.cheek canvas{width:100%;height:100%;display:block}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--plate);position:relative}
.hdr{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--plate2)}
.brand{display:flex;align-items:center;gap:8px}
.brand .name{font-style:italic;font-weight:800;font-size:26px;letter-spacing:.5px;color:#fff;line-height:1}
.brand .s87{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.sp{flex:1}
button,select,input{font-family:var(--font-ui)}
.btn{background:var(--plate);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 10px;font-size:14px;letter-spacing:.5px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn:focus-visible,.knob:focus-visible,.chip:focus-visible,.rh:focus-visible,.card:focus-visible,.tgl:focus-visible{outline:2px solid var(--selb);outline-offset:2px}
.btn.on{background:var(--sel);border-color:var(--selb);color:#E1CBF4}
.btn[disabled]{opacity:.4;cursor:default}
.presetbar{display:flex;align-items:center;gap:4px}
.presetbar .pname{width:210px;text-align:center;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;display:grid;grid-template-columns:716px 288px 92px;min-height:0;overflow:hidden}
/* rack column */
.rackcol{display:flex;flex-direction:column;gap:4px;padding:6px;min-width:0;min-height:0}
.strip{height:84px;flex:none;border:1px solid var(--line);border-radius:6px;background:var(--plate2);display:flex;align-items:center;gap:4px;padding:6px 8px 0 8px;position:relative}
.strip .cap{position:absolute;left:10px;top:2px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--title);white-space:nowrap}
.strip .cap2{position:absolute;right:10px;top:2px;font-size:11px;letter-spacing:1px;color:var(--dim);white-space:nowrap}
.flow{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:0;height:100%;padding-top:6px}
.arr{width:9px;flex:none;text-align:center;color:var(--accent);font-size:13px;line-height:1}
.stg{display:flex;flex-direction:column;gap:3px;align-items:center;flex:none}
.stg.pr{border:1px solid var(--line);border-radius:7px;padding:3px 4px 2px;background:var(--disp);position:relative}
.stg .pm{font-family:var(--font-num);font-size:9px;color:var(--dim);white-space:nowrap}
.chip{display:flex;align-items:center;gap:4px;width:42px;height:22px;padding:0 4px;border:1px solid var(--line);border-radius:4px;background:var(--plate);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;line-height:1}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--uc);flex:none}
.chip.sel{border-color:var(--selb);background:var(--sel)}
.chip.off{opacity:.4}
.chip.solo{box-shadow:0 0 0 1px var(--y)}
.chip.mute{box-shadow:0 0 0 1px var(--r)}
.endk{display:flex;flex-direction:column;align-items:center;width:44px;flex:none;padding-top:6px}
.tb{height:28px;flex:none;display:flex;align-items:center;gap:6px}
.tb .cnt{font-size:13px;color:var(--dim);letter-spacing:1px;white-space:nowrap}
.tb .rig{display:flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:4px;padding:1px 6px;height:26px}
.tb .rig span{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.tb select{background:var(--disp);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 4px;font-size:14px;height:22px}
.rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:3px;position:relative}
.rrow{display:flex;gap:6px;height:var(--rh,52px);flex:none}
.rph{height:30px;flex:none;border:1px dashed var(--line);border-radius:5px;background:transparent;color:var(--dim);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center}
.rph:hover,.rph:focus-visible{border-color:var(--selb);color:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:6px;padding:26px 20px;color:var(--dim);font-size:16px;text-align:center;line-height:1.3}
.card{flex:1;min-width:0;height:var(--rh,52px);display:flex;align-items:center;gap:4px;padding:0 4px 0 0;background:var(--plate2);border:1px solid var(--line);border-left:3px solid var(--uc);border-radius:5px;position:relative}
.card.sel{border-color:var(--selb);border-left-color:var(--uc);background:var(--sel)}
.card.off .nm,.card.off .mk,.card.off .grw{opacity:.45}
.card.dragging{opacity:.3}
.grip{width:12px;align-self:stretch;flex:none;cursor:grab;background:radial-gradient(circle,var(--dim) 1px,transparent 1.5px) 0 0/6px 6px;background-position:3px 6px;opacity:.7;margin:4px 0}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;cursor:pointer;line-height:1.05}
.nm b{font-style:italic;font-weight:700;font-size:15px;white-space:nowrap;letter-spacing:.3px}
.nm i{font-style:normal;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;margin-top:2px}
.card.m .nm b{color:var(--pink);text-decoration:line-through}
.mks{display:flex;gap:0;flex:none}
.card:not(.pr) .mks{gap:8px}
.mk{display:flex;flex-direction:column;align-items:center;width:32px}
.card:not(.pr) .mk{width:40px}
.mk .ml{font-family:var(--font-num);font-size:9px;color:var(--dim);height:11px;line-height:11px;white-space:nowrap;margin-top:1px;letter-spacing:-.3px}
.grw{flex:none;display:block;margin:0 2px}
.btns{display:flex;gap:2px;flex:none}
.tgl{height:22px;min-width:20px;padding:0 3px;border:1px solid var(--line);border-radius:3px;background:var(--plate);color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.5px;cursor:pointer;line-height:1}
.tgl.on{color:#06080a;border-color:transparent}
.tgl.t-on.on{background:var(--g)}
.tgl.t-s.on{background:var(--y)}
.tgl.t-m.on{background:var(--r);color:#fff}
.dropline{position:absolute;left:0;right:0;height:3px;background:var(--selb);border-radius:2px;pointer-events:none;box-shadow:0 0 8px var(--selb)}
.droppar{position:absolute;border:2px dashed var(--selb);border-radius:6px;background:rgba(205,146,254,.12);pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#E1CBF4;letter-spacing:1px;text-transform:uppercase}
.ghost{position:absolute;z-index:40;pointer-events:none;background:var(--sel);border:1px solid var(--selb);border-radius:5px;padding:4px 10px;font-style:italic;font-weight:700;font-size:15px;opacity:.92}
/* unit panel */
.detail{border-left:1px solid var(--line);background:var(--plate2);padding:8px;display:flex;flex-direction:column;gap:7px;min-width:0;min-height:0}
.dh{display:flex;align-items:center;gap:8px}
.dh i{width:10px;height:10px;border-radius:50%;background:var(--uc);flex:none}
.dh b{font-style:italic;font-weight:800;font-size:22px;line-height:1;white-space:nowrap}
.dh small{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:2px;white-space:nowrap}
.drow{display:flex;gap:4px;align-items:center}
.drow .sp{flex:1}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 0}
.kc{display:flex;flex-direction:column;align-items:center;min-width:0}
.kc .kl{font-size:13px;letter-spacing:1.5px;color:var(--title);font-weight:700;text-transform:uppercase;height:15px;white-space:nowrap;line-height:15px}
.kc .kv{font-family:var(--font-num);font-size:11px;color:var(--dim);height:14px;white-space:nowrap;margin-top:-2px}
.kc .kv b{color:var(--ink);font-weight:600}
.dcap{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--title);gap:6px}
.dcap span:last-child{font-family:var(--font-num);color:var(--ink);letter-spacing:0;text-transform:none;font-size:11px;white-space:nowrap}
.dcv{display:block;border:1px solid var(--line);border-radius:3px;background:var(--disp)}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:1}
.seg button{flex:1;background:var(--plate);color:var(--ink);border:0;padding:3px 4px;font-size:13px;cursor:pointer;line-height:1.2;white-space:nowrap}
.seg button.on{background:var(--sel);color:#E1CBF4}
.seg button[disabled]{opacity:.4;cursor:default}
.lanes{display:flex;justify-content:space-around;min-height:78px}
.hintp{font-size:13px;color:var(--dim);line-height:1.25;margin:0}
.sect{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--title)}
/* knob */
.knob{cursor:ns-resize;touch-action:none;border-radius:50%;display:block;flex:none}
.knob svg{display:block;width:100%;height:100%}
.knob .kb{fill:#2b2d33;stroke:#000;stroke-width:3}
.knob .kb2{fill:#3b3e46}
.knob .kt{fill:none;stroke:#000;stroke-width:7;stroke-linecap:round;opacity:.55}
.knob .kva{fill:none;stroke:var(--kc,var(--accent));stroke-width:7;stroke-linecap:round}
.knob .kp{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
/* meters */
.meters{border-left:1px solid var(--line);background:var(--plate2);display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;gap:3px}
.meters .cap{width:84px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:1.5px;color:var(--title);text-transform:uppercase}
.meters .cap span{width:30px;text-align:center}
.meters canvas{display:block;cursor:pointer}
.meters .pk{width:84px;display:flex;justify-content:space-between;font-family:var(--font-num);font-size:10px;color:var(--dim)}
.meters .pk span{width:30px;text-align:center;white-space:nowrap}
.foot{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;color:var(--dim);letter-spacing:1px;border-top:1px solid var(--line);background:var(--plate2)}
.bypassed .rackcol .rows,.bypassed .detail .kgrid{filter:saturate(.3)}
/* overlays */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30}
#modal[hidden]{display:none}
.dlg{width:760px;max-height:580px;background:var(--plate);border:1px solid var(--selb);border-radius:8px;display:flex;flex-direction:column;box-shadow:0 10px 40px #000}
.dlg h2{margin:0;padding:10px 16px;font-size:20px;letter-spacing:1px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--title)}
.dlg .dbody{padding:12px 16px;overflow:hidden;font-size:15px;line-height:1.35;min-height:0}
.dlg .dfoot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.dlg label{display:flex;align-items:center;gap:8px;margin:6px 0}
.dlg input[type=text],.dlg input:not([type]),.dlg select,.dlg textarea{background:var(--disp);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:15px}
.dlg textarea{width:100%;height:230px;font-family:var(--font-num);font-size:12px}
.dlg kbd{font-family:var(--font-num);font-size:12px;border:1px solid var(--line);border-radius:3px;padding:0 5px;background:var(--disp)}
.dlg table{border-collapse:collapse;width:100%}
.dlg td{padding:3px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.dlg p{margin:6px 0}
.dlg a.btn{text-decoration:none;display:inline-block}
.pb{display:grid;grid-template-columns:300px 1fr;gap:14px;height:380px}
.pb .lcol{display:flex;flex-direction:column;gap:6px;min-height:0}
.pb .list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;overflow-y:auto;scrollbar-width:none;background:var(--disp);flex:1;min-height:0}
.pb .item{padding:4px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);font-size:15px;flex:none;align-items:center}
.pb .item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb .item.sel{background:var(--sel);color:#E1CBF4}
.pb .item small{color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.pb .rcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.pb h3{margin:0;font-size:22px;font-style:italic}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip2{background:var(--disp);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:1px 9px;font-size:13px;cursor:pointer}
.chip2.on{background:var(--sel);border-color:var(--selb);color:#E1CBF4}
.chain{font-family:var(--font-num);font-size:12px;color:var(--dim);line-height:1.5;border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--disp)}
.warn{color:var(--r)}
#tip{position:absolute;max-width:300px;background:#000;border:1px solid var(--selb);color:var(--ink);padding:6px 9px;border-radius:5px;font-size:14px;line-height:1.25;z-index:50;pointer-events:none}
#tip[hidden]{display:none}
#toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:#000;border:1px solid var(--selb);padding:5px 14px;border-radius:5px;font-size:15px;z-index:60;white-space:nowrap}
#toast[hidden]{display:none}
#addmenu{position:absolute;z-index:35;background:var(--plate);border:1px solid var(--selb);border-radius:6px;padding:4px;width:290px;box-shadow:0 8px 28px #000}
#addmenu[hidden]{display:none}
#addmenu button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--ink);padding:5px 8px;border-radius:4px;cursor:pointer;font-size:15px;text-align:left}
#addmenu button:hover,#addmenu button:focus-visible{background:var(--sel)}
#addmenu button i{width:9px;height:9px;border-radius:50%;background:var(--uc);flex:none}
#addmenu button small{margin-left:auto;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.rh{position:absolute;z-index:20;background:transparent}
.rh.n{left:12px;right:12px;top:-4px;height:8px;cursor:ns-resize}.rh.s{left:12px;right:12px;bottom:-4px;height:8px;cursor:ns-resize}
.rh.e{top:12px;bottom:12px;right:-4px;width:8px;cursor:ew-resize}.rh.w{top:12px;bottom:12px;left:-4px;width:8px;cursor:ew-resize}
.rh.ne{right:-5px;top:-5px;width:14px;height:14px;cursor:nesw-resize}.rh.sw{left:-5px;bottom:-5px;width:14px;height:14px;cursor:nesw-resize}
.rh.nw{left:-5px;top:-5px;width:14px;height:14px;cursor:nwse-resize}.rh.se{right:-5px;bottom:-5px;width:14px;height:14px;cursor:nwse-resize}
.zoomrow{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim);flex-wrap:wrap;justify-content:center}
.zoomrow .btn{padding:1px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>.rows.cp .nm i{display:none}.rows.cp .mk .ml{height:9px;line-height:9px;margin-top:0}.rows.cp .nm b{font-size:14px}.rows.cp .grip{margin:3px 0}
.dh small.sel{color:var(--accent);margin:0 0 1px}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;height:330px;overflow-y:auto;scrollbar-width:none;align-content:start}.agrid::-webkit-scrollbar{display:none}
.aitem{display:grid;grid-template-columns:10px 1fr;grid-template-rows:auto auto;column-gap:8px;row-gap:1px;text-align:left;padding:6px 10px;background:var(--plate2);border:1px solid var(--line);border-left:3px solid var(--uc);border-radius:5px;color:var(--ink);cursor:pointer;height:64px;align-content:center}
.aitem:hover,.aitem:focus-visible{border-color:var(--selb);border-left-color:var(--uc);background:var(--sel)}.aitem[disabled]{opacity:.4;cursor:default}
.aitem i{width:8px;height:8px;border-radius:50%;background:var(--uc);align-self:center;grid-row:1}
.aitem .an{display:flex;justify-content:space-between;gap:8px;grid-column:2;min-width:0}.aitem .an b{font-style:italic;font-size:16px;white-space:nowrap}.aitem .an em{font-style:normal;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.aitem .ad{grid-column:2;font-size:13px;line-height:1.15;color:var(--dim);min-width:0}
</style>
<style>.pb .list::-webkit-scrollbar{display:none}</style>

<div id="app">
  <div id="frame">
    <div id="stage">
      <div class="cheek" id="cheekL" data-tip="Double-click the wood to reset the window to 100%."><canvas></canvas></div>
      <div class="main" id="main">
        <header class="hdr">
          <div class="brand">
            <svg width="34" height="34" viewBox="0 0 64 64" aria-label="Cat head logo"><path d="M8 6 L24 22 H40 L56 6 L60 36 Q60 58 32 60 Q4 58 4 36 Z" fill="#FF7BB1"/><path d="M12 14 L21 23 H14 Z M52 14 L43 23 H50 Z" fill="#FBBDD0"/><ellipse cx="22" cy="36" rx="4" ry="5" fill="#16171a"/><ellipse cx="42" cy="36" rx="4" ry="5" fill="#16171a"/><path d="M29 44 H35 L32 48 Z" fill="#16171a"/><path d="M32 48 Q28 53 24 50 M32 48 Q36 53 40 50" stroke="#16171a" stroke-width="2" fill="none"/><path d="M2 40 H14 M2 46 H14 M62 40 H50 M62 46 H50" stroke="#FBBDD0" stroke-width="1.6"/></svg>
            <span class="name">CatRack</span><span class="s87">Studio 87</span>
          </div>
          <div class="sp"></div>
          <div class="presetbar">
            <button class="btn" id="pPrev" data-tip="Previous chain preset.">&#9664;</button>
            <button class="btn pname" id="pName" data-tip="Open the preset browser: 25 ready-made chains plus your own. Double-click to rename your own preset.">Start Here</button>
            <button class="btn" id="pNext" data-tip="Next chain preset.">&#9654;</button>
            <button class="btn" id="pSave" data-tip="Save this whole chain as your own preset. Asks before overwriting.">Save</button>
          </div>
          <div class="sp"></div>
          <button class="btn" id="bBypass" aria-pressed="false" data-tip="Bypass: hear the dry signal to compare with the processed sound (key B). The meters keep moving.">Bypass</button>
          <button class="btn" id="bGuide" data-tip="Short guide and keyboard shortcuts.">Guide</button>
          <button class="btn" id="bSettings" data-tip="Info bubbles, power saving, colour look.">Settings</button>
          <button class="btn" id="bAbout" data-tip="About CatRack, support and where your files live.">About &amp; Support</button>
        </header>
        <div class="body">
          <section class="rackcol">
            <div class="strip" id="strip"></div>
            <div class="tb">
              <button class="btn" id="bAdd" data-tip="Open the unit browser.">+ Add unit</button>
              <button class="btn" id="bClear" data-tip="Remove every unit from the rack.">Clear</button>

$('#bGuide').onclick=()=>openModal('Guide',`<p><b>The idea.</b> The rack holds up to 12 units. The signal goes through them from top to bottom, as the strip at the top shows from left to right. Click a unit and its controls appear in the panel on the right, headed Selected unit. The Add unit button opens a browser of every Studio 87 effect, sorted into six groups.</p>
<p><b>Change the order.</b> Drag a unit by its dotted handle. Drop it on the top or bottom edge of a row to place it before or after. Drop it on the middle of another single unit to run the two side by side.</p>
<p><b>Side by side (parallel).</b> Two units in one row are added together. Each lane has a level, and the pair has a Dry/Wet. A row holds two units at most. With many units the rows shrink so nothing needs scrolling.</p>
<p><b>ON, S, M.</b> ON switches a unit on or off. S (solo) lets only the soloed units work so you can hear them alone. M (mute) silences a unit; in a pair only that lane goes quiet.</p>
<table><tr><td><kbd>Space</kbd></td><td>Start or pause the preview signal</td></tr><tr><td><kbd>B</kbd></td><td>Bypass on or off</td></tr><tr><td><kbd>[</kbd> / <kbd>]</kbd></td><td>Previous or next preset</td></tr><tr><td><kbd>Up</kbd> / <kbd>Down</kbd></td><td>On a focused unit: select the one above or below</td></tr><tr><td><kbd>Alt+Up</kbd> / <kbd>Alt+Down</kbd></td><td>Move the focused unit's row earlier or later</td></tr><tr><td><kbd>Delete</kbd></td><td>Remove the focused unit</td></tr><tr><td>Knobs</td><td>Drag up or down; Shift for fine; double-click to reset; arrow keys and mouse wheel also work</td></tr></table>`,null);
